<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Start screen</title>
	<style>body { margin: 0; height: 100vh; overflow: hidden; background: #0b3a4a url(/ui/keyart-720.jpg) center / cover; }</style>
</head>
<body>
<script type="module">
// Dev / test page: the start screen with the mode menu (ui/UI.js setModes), no game behind it.
// ?mode=spear preselects; window.__started holds the pick once a button starts it
// (with .multi { host, name } or { code, name } from the Multiplayer panel).
import '../src/ui/ui.css';
import { UI } from '../src/ui/UI.js';
import { MODES, DIFFICULTY } from '../src/game/Mode.js';
import { suitPicker } from '../src/ui/SuitPicker.js';

const qs = new URLSearchParams( location.search );
const ui = new UI();
ui.setModes( MODES, DIFFICULTY, { mode: qs.get( 'mode' ) || 'leisure', difficulty: 'standard' } );
// ?dive=<code> as an invite link opens the multiplayer panel with it; ?nomp leaves it out
window.__look = { suit: 0x16191c, accent: 0xff7a1a, fins: 0x111316 };
if ( ! qs.has( 'nomp' ) ) ui.setMultiplayer( { code: qs.get( 'dive' ) || '', name: qs.get( 'name' ) || 'Diver 42', extra: suitPicker( window.__look, ( l ) => { window.__look = l; } ).el } );
ui.showStartOverlay( ( choice ) => { window.__started = JSON.parse( JSON.stringify( choice ) ); } );
</script>
</body>
</html>
