<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Diver figure</title>
	<style>body { margin: 0; background: #06202c; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script type="module">
// Dev / test page: the freediver figure (game/Diver.js) in its poses, lit by the engine, no world.
// Left to right: standing, hanging at the surface, swimming level, streamlining down, blacked out.
// ?view=first shows the first-person view instead (what you see of your own body looking down).
// window.__done is set once the frame is drawn; window.__stats holds the renderer's counts.
import { GPU } from '../src/engine/gpu/GPU.js';
import { RenderTarget } from '../src/engine/gpu/Texture.js';
import { readTexture } from '../src/engine/gpu/Readback.js';
import { G, setFrameCamera } from '../src/engine/render/Frame.js';
import { Material } from '../src/engine/render/Material.js';
import { MeshRenderer } from '../src/engine/render/MeshRenderer.js';
import { SunShadows } from '../src/engine/render/Shadows.js';
import { FullscreenPass } from '../src/engine/render/FullscreenPass.js';
import * as E from '../src/engine/index.js';
import { Diver } from '../src/game/Diver.js';
import { createPropMaterial } from '../src/game/GameMaterials.js';

const qs = new URLSearchParams( location.search );
const canvas = document.getElementById( 'c' );
const W = canvas.width, H = canvas.height;
await GPU.init( { headless: true } );
const scene = new E.Scene();
const ground = new E.Mesh( new E.PlaneGeometry( 60, 60 ).rotateX( - Math.PI / 2 ), new Material( { name: 'sand', color: 0x8a7a5a, roughness: 0.95 } ) );
ground.position.y = - 2.6;
scene.add( ground );
const material = createPropMaterial( 'diver' );
const first = qs.get( 'view' ) === 'first';
const poses = [
	{ mode: 'walk', floating: false, pitch: 0, speed: 0 },
	{ mode: 'swim', floating: true, pitch: 0, speed: 0 },
	{ mode: 'swim', floating: false, pitch: 0, speed: 1.5 },
	{ mode: 'swim', floating: false, pitch: - 1.2, speed: 2.4, sprint: true },
	{ mode: 'swim', floating: false, pitch: 0, speed: 0.3, blackout: true },
];
const divers = [];
const dt = 1 / 60;
if ( first ) {

	const d = new Diver( { material, hue: 0.08 } );
	d.setPose( { mode: 'swim', floating: true, pitch: - 1.1, speed: 0 } );
	for ( let t = 0; t < 3; t += dt ) d.update( dt );
	// a quarter kick in: both legs out of line
	for ( let t = 0; t < 0.4; t += dt ) d.update( dt );
	d.showHead( false );
	d.placeEye( 0.3, new E.Vector3( 0, 0, 0 ) );
	scene.add( d.group );
	divers.push( d );

} else {

	poses.forEach( ( p, i ) => {

		const d = new Diver( { material, hue: ( 0.08 + i * 0.19 ) % 1 } );
		d.setPose( p );
		for ( let t = 0; t < 3; t += dt ) d.update( dt );
		for ( let t = 0; t < 0.35; t += dt ) d.update( dt );
		const x = ( i - 2 ) * 2.2;
		if ( p.mode === 'walk' ) d.place( Math.PI * 0.8, new E.Vector3( x, - 2.6, 0 ) );
		else d.place( Math.PI * 0.8, new E.Vector3( x, 0, 0 ) );
		scene.add( d.group );
		divers.push( d );

	} );

}

const camera = new E.PerspectiveCamera( first ? 80 : 45, W / H, 0.1, 1000 );
if ( first ) {

	camera.position.set( 0, 0, 0 );
	camera.quaternion.setFromEuler( new E.Euler( - 1.1, 0.3, 0, 'YXZ' ) );

} else {

	camera.position.set( 1.5, 0.6, 9.5 );
	camera.lookAt( 0, - 0.5, 0 );

}

G.sunDir.value.set( 0.3, 0.8, 0.5 ).normalize();
G.sunColor.value.setRGB( 2.6, 2.7, 2.9 );
G.skyIrradiance.value.setRGB( 0.18, 0.3, 0.45 );

const rt = new RenderTarget( W, H, { colors: [ 'rgba16float', 'rgba16float', 'rgba8unorm' ], depth: 'depth32float', label: 'scene' } );
const mr = new MeshRenderer();
const shadows = new SunShadows();
const tonemap = new FullscreenPass( { label: 'tonemap', colorFormats: [ 'rgba8unorm' ], bindings: { hdr: { texture: () => rt.texture } },
	code: `fn fragment( in: FSIn ) -> vec4f {
		let c = textureLoad( hdr, vec2i( in.pos.xy ), 0 ).rgb;
		let a = c * 0.8; let t = ( a * ( 2.51 * a + 0.03 ) ) / ( a * ( 2.43 * a + 0.59 ) + 0.14 );
		return vec4f( linearToSrgb( sat3( t ) ), 1.0 ); }` } );
const ldr = new RenderTarget( W, H, { colors: [ 'rgba8unorm' ], label: 'ldr' } );
for ( let f = 0; f < 2; f ++ ) {

	GPU.beginFrame();
	setFrameCamera( camera, W, H );
	shadows.render( scene, mr, shadows.update( camera, G.sunDir.value ) );
	mr.render( scene, { camera, kind: 'main', colorViews: rt.textures.map( ( t ) => t.view() ), colorFormats: rt.formats,
		clearColors: [ [ 0.02, 0.12, 0.22, 1 ], [ 0, 0, 0, 0 ], [ 0, 0, 0, 0 ] ], depthView: rt.depthTexture.view(), depthFormat: 'depth32float', clearDepth: 0 } );
	tonemap.render( { colorViews: [ ldr.texture ] } );
	GPU.submit();

}

const img = await readTexture( ldr.texture );
const ctx = canvas.getContext( '2d' );
const id = new ImageData( new Uint8ClampedArray( img.data ), W, H );
ctx.putImageData( id, 0, 0 );
window.__stats = mr.stats;
window.__done = true;
</script>
</body>
</html>
