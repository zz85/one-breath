<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Dive with friends</title>
	<style>body { margin: 0; height: 100vh; overflow: hidden; background: #0b3a4a url(/ui/keyart-720.jpg) center / cover; }</style>
</head>
<body>
<script type="module">
// Dev / test page: the HUD with the dive-with-friends panel (game/NetPlay.js, ui/NetUI.js) and a
// stand-in player, no world. ?dive=<code> joins; ?x=&z= puts this player there, facing -z.
// window.__np is the NetPlay. test/netplay-two.mjs drives two of these.
import '../src/ui/ui.css';
import { UI } from '../src/ui/UI.js';
import { NetPlay } from '../src/game/NetPlay.js';
import { Group, PerspectiveCamera, Vector3 } from '../src/engine/index.js';

const qs = new URLSearchParams( location.search );
const ui = new UI();
const camera = new PerspectiveCamera( 60, innerWidth / innerHeight, 0.1, 1000 );
camera.position.set( 0, 0.2, 0 );
const scene = new Group();
const player = { position: new Vector3( Number( qs.get( 'x' ) || 0 ), 0, Number( qs.get( 'z' ) || 0 ) ), velocity: new Vector3( 0, 0, - 1 ), yaw: 0, pitch: 0, mode: 'swim', floating: true, waterH: 0 };
const settings = { timeOfDay: 16.2, timeSpeed: 0 };
// a stand-in for ui/AppUI.js's conditions: plain numbers, the same names and the same weathers
const SEA = { Calm: { wind: 3.5 }, Breezy: { wind: 7 }, Choppy: { wind: 12 }, Storm: { wind: 20 } };
const cond = { wind: 7, clouds: 0.42 };
const appUI = {
	getConditions: () => ( { time: settings.timeOfDay, speed: settings.timeSpeed, ...cond } ),
	setConditions( c ) { if ( typeof c.time === 'number' ) settings.timeOfDay = c.time; if ( typeof c.speed === 'number' ) settings.timeSpeed = c.speed; for ( const k in cond ) if ( typeof c[ k ] === 'number' ) cond[ k ] = c[ k ]; },
	setWeather( n ) { this.setConditions( { ...SEA[ n ], clouds: n === 'Storm' ? 0.95 : 0.42 } ); },
	get weather() { return Object.keys( SEA ).find( ( k ) => SEA[ k ].wind === cond.wind ); },
};
// stand-ins for the reef's fish and the whale: what NetPlay sends and takes of them
const life = window.__life = { fishIn: [], whaleIn: [], startled: [], others: null, n: 0 };
const reef = { fish: {
	netState: () => new Float32Array( [ 7, 0, ++ life.n, - 5, 120, 0, - 5, 130, 1, 0, 0.5, 0 ] ),
	applyNet: ( a, age ) => { life.fishIn.push( { a: Array.from( a ), age } ); return 1; },
	clearNet: () => { life.cleared = true; },
	set others( v ) { life.others = v; }, get others() { return life.others; },
} };
const whale = { brain: { netState: () => ( { u: 100 + life.n, y: - 9, state: 'cruise', seq: null } ), applyNet: ( s, age ) => { life.whaleIn.push( { s, age } ); return true; }, startle: ( side ) => life.startled.push( side ) } };
const app = { qs, scene, camera, player, settings, ui: appUI, reef, whale, input: { keys: new Set(), vkeys: new Set(), touch: false, requestLock() {} }, audio: null };
const me = { diver: { look: null, setLook( l ) { this.look = l; } } };
// a stand-in for the speargun game: what NetPlay reads of it (the test sets these)
const spear = { equipped: false, aiming: false, phase: 'home', onShot: null, gun: { bandsLoaded: 0, shaftHome: true, gear: { gunM: 0.9, bands: 2, gunKind: 'teak' } } };
const game = { app, stand: { material: null }, spear, me };
window.__game = game;
setInterval( () => { settings.timeOfDay = ( settings.timeOfDay + settings.timeSpeed * 0.1 ) % 24; }, 100 );
const np = window.__np = new NetPlay( game );
np.attach( ui );
let last = performance.now();
const loop = ( t ) => { const dt = Math.min( 0.1, ( t - last ) / 1000 ); last = t; np.update( dt ); requestAnimationFrame( loop ); };
requestAnimationFrame( loop );
</script>
</body>
</html>
